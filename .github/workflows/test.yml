name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - run: npm ci
    - run: npm run build && npm run typecheck
    - run: docker build -t demo:test .
    - run: docker run -d --name demo --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:8080:8080 -e APP_VERSION=ci-test demo:test
    - run: npm test
      env:
        EXPECT_VERSION: ci-test
    - if: always()
      run: docker logs demo || true
    - if: always()
      run: docker rm -f demo || true
